<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>    
  <!-- Marker cluster styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <title>Plannea - Eventos</title>
</head>

<body>
  <!-- HEADER -->
  <header class="main-header">
    <img src="images/PLANNEA.png" alt="Plannea Logo" class="logo" />
    <div class="header-buttons">
      <button id="btnUser" class="user-button" aria-label="Iniciar sesión o perfil">👤</button>
      <button id="btnSettings" class="settings-button" aria-label="Ajustes">⚙️</button>
    </div>
  </header>

  <!-- LOGIN / REGISTER MODAL -->
  <div id="authModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="modal-close" data-close="modal" aria-label="Cerrar">×</button>
      <h2 id="authTitle">Cuenta</h2>

      <div id="userContent" hidden>
        <div class="auth-tabs">
          <button id="tabProfile" class="tab active" aria-pressed="true">Perfil</button>
          <button id="tabTickets" class="tab" aria-pressed="false">Mis Tickets</button>
        </div>

        <div id="profileSection">
          <p>Conectado como <strong id="profileEmail"></strong></p>
          <button id="btnLogout" class="ghost">Cerrar sesión</button>
        </div>

        <div id="ticketsSection" hidden>
          <div class="tickets-header" style="display:flex; gap:.5rem; align-items:center; margin-bottom:.6rem;">
            <input id="ticketsSearch" type="search" placeholder="Buscar mis tickets" style="flex:1; padding:.4rem;" />
          </div>
          <div id="myTicketsContainer">
            <!-- tickets rendered here -->
          </div>
        </div>
      </div>

      <div id="authContent">
        <div id="authMessage" class="auth-message" hidden aria-live="polite"></div>
        <div class="auth-tabs">
          <button id="tabLogin" class="tab active" aria-pressed="true">Iniciar sesión</button>
          <button id="tabRegister" class="tab" aria-pressed="false">Registrarse</button>
        </div>

        <div class="auth-forms-row">
          <form id="loginForm" class="auth-form" aria-label="Formulario iniciar sesión">
          <label for="loginEmail">Correo electrónico
            <input id="loginEmail" name="email" type="email" required />
          </label>
          <label for="loginPassword">Contraseña
            <input id="loginPassword" name="password" type="password" required />
          </label>
          <div class="auth-actions">
            <button type="submit" class="primary">Iniciar sesión</button>
          </div>
          </form>

          <form id="registerForm" class="auth-form" aria-label="Formulario registro">
          <label for="regEmail">Correo electrónico
            <input id="regEmail" name="email" type="email" required />
          </label>
          <label for="regUsername">Nombre de usuario
            <input id="regUsername" name="username" type="text" required />
          </label>
          <label for="regPassword">Contraseña
            <input id="regPassword" name="password" type="password" required />
          </label>
          <div class="auth-actions">
            <button type="submit" class="primary">Registrarse</button>
          </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- GEOLOCATION PERMISSION MODAL -->
  <div id="geoModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="geo-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="geoTitle">
      <h2 id="geoTitle">Ubicación</h2>
      <p>¿Deseas activar la ubicación para ver eventos cercanos? Esto es opcional y puedes cambiarlo más tarde en la configuración.</p>
      <div style="display:flex; gap:.5rem; justify-content:flex-end; margin-top: .8rem;">
        <button class="ghost" data-close="geo-modal">No usar ubicación</button>
        <button id="geoAllowBtn" class="primary">Activar ubicación</button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast" class="toast" hidden aria-live="polite"></div>

  <!-- CONFIRMATION MODAL (reusable) -->
  <div id="confirmModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="confirm-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Confirmar</h2>
      <p id="confirmMessage">¿Estás seguro?</p>
      <div style="display:flex; gap:.5rem; justify-content:flex-end; margin-top:.8rem;">
        <button id="confirmCancel" class="ghost">Cancelar</button>
        <button id="confirmOk" class="primary">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- CONTENIDO -->
  <main>
    <div id="map" style="height: calc(100vh - 120px);"></div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active" aria-label="Eventos">
      <!-- Ticket (minimal) -->
      <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7h18v4a2 2 0 0 1-2 2 2 2 0 1 0 0 4v4H3v-4a2 2 0 1 0 0-4V7z"/>
      </svg>
      <span class="nav-text">Eventos</span>
    </a>
    <a href="pages/agenda.html" class="nav-item" aria-label="Agenda">
      <!-- Calendar -->
      <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>
      </svg>
      <span class="nav-text">Agenda</span>
    </a>
    <a href="pages/notificaciones.html" class="nav-item" aria-label="Notificaciones">
      <!-- Bell -->
      <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="nav-text">Notificaciones</span>
    </a>
  </nav>

  <!-- LIBRERÍAS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster-src.js"></script>
  <!-- Shared events data -->
  <script src="js/events.js"></script>

  <!-- MAPA -->
  <script>
    function initMap(position) {
      const defaultLat = -34.6037;
      const defaultLng = -58.3816; // Coordenadas por defecto (Buenos Aires)
      
      const lat = position ? position.coords.latitude : defaultLat;
      const lng = position ? position.coords.longitude : defaultLng;

      const map = L.map('map').setView([lat, lng], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data © OpenStreetMap contributors'
      }).addTo(map);

      // marker cluster group
      const markersGroup = L.markerClusterGroup();

      // marker for user only if we have their position
      if (position) {
        const you = L.marker([lat, lng]).bindPopup('Estás aquí');
        markersGroup.addLayer(you);
      }

      // Use shared events from js/events.js (window.planneaEvents)
      const baseEvents = window.planneaEvents || [];
      const eventos = baseEvents.map(ev => {
        const off = ev.offset || [0,0];
        return { nombre: ev.nombre, slug: ev.slug, lat: lat + (off[0] || 0), lng: lng + (off[1] || 0) };
      });

      eventos.forEach(e => {
        const m = L.marker([e.lat, e.lng]);
        const safeName = (e.nombre || '').replace(/'/g, "\\'");
        const detailUrl = 'pages/event.html?slug=' + encodeURIComponent(e.slug || '');
        m.bindPopup(`<strong>${e.nombre}</strong><br/><button onclick="popupVerDetalles('${safeName}','${detailUrl}')" class="popup-btn">Comprar</button>`);
        markersGroup.addLayer(m);
      });

      map.addLayer(markersGroup);
    }

    // Show geolocation modal first
    const geoModal = document.getElementById('geoModal');
    if (geoModal) {
      geoModal.hidden = false;
      document.body.classList.add('modal-open');

      // Handle button clicks
      document.getElementById('geoAllowBtn')?.addEventListener('click', function() {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            geoModal.hidden = true;
            document.body.classList.remove('modal-open');
            initMap(position);
          },
          function() {
            geoModal.hidden = true;
            document.body.classList.remove('modal-open');
            initMap(null); // Initialize with default coordinates
          }
        );
      });

      // Handle "No usar ubicación"
      const skipButtons = geoModal.querySelectorAll('[data-close="geo-modal"]');
      skipButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          geoModal.hidden = true;
          document.body.classList.remove('modal-open');
          initMap(null); // Initialize with default coordinates
        });
      });
    }
  </script>

  <!-- PURCHASE MODAL -->
  <div id="purchaseModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="purchase-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="purchaseTitle">
      <h2 id="purchaseTitle">Comprar entrada</h2>
      <div style="display:grid; gap:.6rem;">
        <div><strong id="purchaseEventName"></strong></div>
        <label>Cantidad
          <select id="purchaseQty"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </label>
        <label>Tu nombre
          <input id="purchaseBuyer" type="text" placeholder="Nombre" />
        </label>
        <label id="labelRecipient" style="display:none">Destinatario (opcional)
          <input id="purchaseRecipient" type="text" placeholder="Nombre del destinatario" />
        </label>
        <div id="purchaseTotal" style="font-weight:700; margin-top:.25rem">Total: -</div>
        <div style="display:flex; gap:.5rem; justify-content:flex-end;">
          <button id="purchaseCancel" class="ghost">Cancelar</button>
          <button id="purchaseConfirm" class="primary">Confirmar compra</button>
        </div>
      </div>
    </div>
  </div>

  <!-- APP JS (login/menu perfil) -->
  <script src="js/app.js"></script>
</body>
</html>
